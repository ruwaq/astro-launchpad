server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.stellar.org wss://*.stellar.org https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://*.reown.com https://*.web3modal.org https://*.web3modal.com https://api.coinbase.com https://api.binance.com https://api.coingecko.com https://min-api.cryptocompare.com https://friendbot.stellar.org; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; frame-src 'self' https://*.walletconnect.com https://*.walletconnect.org; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # Immutable Cache for Hashed Assets
    location ~* \.(?:css|js|woff2?|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Revalidate Service Worker on every load
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
