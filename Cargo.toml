[workspace]
resolver = "2"
members = ["contracts/token"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Astro Launchpad"]

[workspace.dependencies]
# Pin exacto: la lib de OZ itera rápido (recomendación del propio proyecto).
stellar-tokens = "=0.8.0"
stellar-access = "=0.8.0"
stellar-macros = "=0.8.0"
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Profile para depurar contratos con logs en testnet.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
